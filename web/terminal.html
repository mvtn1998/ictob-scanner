<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Terminal — chart</title>
<link rel="stylesheet" href="/terminal.css" />
</head>
<body>
<div class="app" id="app" data-theme="dark">

  <!-- ============================ top toolbar ============================ -->
  <header class="topbar">
    <a class="brand" href="/" title="Back to OB Sentinel">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 18V9M9.3 18V4M14.6 18v-6M20 18V7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </a>
    <button class="sym-btn" id="symbolBtn" title="Change symbol">
      <span class="sym-badge" id="symbolBadge">N</span>
      <span class="sym-name" id="symbolName">NIFTY 50</span>
      <span class="sym-chev">▾</span>
    </button>
    <span class="tb-sep"></span>
    <div class="tb-group">
      <button class="tb-btn" id="intervalBtn" title="Interval"><span id="intervalLabel">1D</span><span class="caret">▾</span></button>
      <button class="tb-btn" id="typeBtn" title="Chart type">
        <svg viewBox="0 0 16 16"><path d="M8 2v12M4.6 5h6.8M4.6 11h6.8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><rect x="4" y="4" width="8" height="8" rx="1" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>
      </button>
    </div>
    <span class="tb-sep"></span>
    <button class="tb-btn" id="indicatorsBtn" title="Indicators, metrics and strategies">
      <svg viewBox="0 0 16 16"><path d="M2.5 11.5c2-5 4-5 6 0s4.5 1 5-4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      <span class="tb-label">Indicators</span>
    </button>
    <button class="tb-btn" id="compareBtn" title="Compare symbol">
      <svg viewBox="0 0 16 16"><path d="M3 4h10M3 12h10" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><circle cx="6" cy="4" r="1.8" fill="currentColor"/><circle cx="10" cy="12" r="1.8" fill="currentColor"/></svg>
    </button>
    <span class="tb-sep"></span>
    <button class="tb-btn" id="alertBtn" title="Create alert">
      <svg viewBox="0 0 16 16"><path d="M4 11V7a4 4 0 1 1 8 0v4l1.2 1.6H2.8L4 11Z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><path d="M6.6 14a1.6 1.6 0 0 0 2.8 0" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>
    </button>
    <button class="tb-btn" id="replayBtn" title="Bar replay">
      <svg viewBox="0 0 16 16"><path d="M4.5 3.5v9l7.5-4.5-7.5-4.5Z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
    </button>
    <span class="tb-sep"></span>
    <button class="tb-btn" id="undoBtn" title="Undo" disabled>
      <svg viewBox="0 0 16 16"><path d="M6 4 3 7l3 3" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M3.4 7H9a3.6 3.6 0 0 1 0 7.2H6" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
    </button>
    <button class="tb-btn" id="redoBtn" title="Redo" disabled>
      <svg viewBox="0 0 16 16"><path d="m10 4 3 3-3 3" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M12.6 7H7a3.6 3.6 0 0 0 0 7.2h3" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
    </button>
    <span class="tb-spacer"></span>
    <button class="tb-btn tb-text" id="layoutBtn" title="Manage layouts">Layout</button>
    <button class="tb-btn tb-text" id="saveBtn" title="Save layout">Save</button>
    <span class="tb-sep"></span>
    <button class="tb-btn" id="searchBtn" title="Quick search (Ctrl+K)">
      <svg viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.2" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="m10.4 10.4 3 3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
    </button>
    <button class="tb-btn" id="settingsBtn" title="Chart settings">
      <svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="2.4" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M8 1.8v2M8 12.2v2M1.8 8h2M12.2 8h2M3.6 3.6l1.4 1.4M11 11l1.4 1.4M12.4 3.6 11 5M5 11l-1.4 1.4" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
    </button>
    <button class="tb-btn" id="fullscreenBtn" title="Fullscreen mode">
      <svg viewBox="0 0 16 16"><path d="M6 2.5H2.5V6M10 2.5h3.5V6M6 13.5H2.5V10M10 13.5h3.5V10" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button class="tb-btn" id="snapshotBtn" title="Take a snapshot">
      <svg viewBox="0 0 16 16"><rect x="1.8" y="4.4" width="12.4" height="9" rx="1.6" fill="none" stroke="currentColor" stroke-width="1.3"/><circle cx="8" cy="9" r="2.5" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M5.6 4.4 6.6 2.8h2.8l1 1.6" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>
    </button>
  </header>

  <!-- ============================== workspace ============================ -->
  <div class="workspace">
    <aside class="drawbar" id="drawbar"></aside>

    <section class="chart-host" id="chartHost">
      <div class="chart-wrap" id="chartWrap">
        <canvas id="chartCanvas"></canvas>
        <div class="top-legend" id="topLegend"></div>
        <div class="pane-legends" id="paneLegends"></div>
        <div class="cursor-legend" id="cursorLegend" hidden></div>
        <div class="replay-bar" id="replayBar" hidden>
          <span class="rb-label">Bar replay</span>
          <button class="rb-btn" id="replayJump" title="Jump to start">⏮</button>
          <button class="rb-btn" id="replayPrev" title="Previous bar">◀</button>
          <button class="rb-btn" id="replayPlay" title="Play / pause">▶</button>
          <button class="rb-btn" id="replayNext" title="Next bar">▶|</button>
          <select class="rb-sel" id="replaySpeed" title="Replay speed">
            <option value="900">0.5×</option>
            <option value="420" selected>1×</option>
            <option value="200">2×</option>
            <option value="90">5×</option>
          </select>
          <span class="rb-step" id="replayStep">—</span>
          <button class="rb-btn" id="replayStart" title="Pick the starting bar">⤓</button>
          <button class="rb-btn" id="replayExit" title="Exit replay">✕</button>
        </div>
        <button class="golive" id="goLive" hidden title="Go to the latest bar">
          <svg viewBox="0 0 16 16" width="15" height="15"><path d="M2 8h10M8.5 3.5 13 8l-4.5 4.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <div class="loading" id="loading" hidden><span></span>Loading chart…</div>
      </div>
      <footer class="statusbar">
        <button class="sb-btn" id="rangeBtn">Date Range</button>
        <button class="sb-btn" id="tzBtn">UTC+5:30</button>
        <span class="sb-clock" id="clock">--:--:--</span>
        <span class="sb-spacer"></span>
        <span class="chip" id="sourceChip">SAMPLE</span>
        <span class="sb-info" id="barInfo"></span>
        <span class="sb-info" id="scaleInfo"></span>
        <button class="sb-btn" id="shortcutsBtn" title="Keyboard shortcuts">⌨</button>
      </footer>
    </section>

    <aside class="sidebar" id="sidebar">
      <nav class="rail" id="rail"></nav>
      <div class="panel" id="panel"></div>
    </aside>
  </div>

  <div class="overlay" id="overlay" hidden></div>
  <div class="popover" id="popover" hidden></div>
  <div class="modal" id="modal" hidden></div>
  <div class="toasts" id="toasts"></div>
</div>

<script src="/terminal-chart.js"></script>
<script src="/terminal.js"></script>
</body>
</html>
