services:
  - type: web
    name: smartmoney
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free             # $0 forever; sleeps after 15 min idle and wakes in ~1 min
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: OB_CLOUD       # the deployed copy signs in to Upstox on its own
        value: "1"
      - key: UPSTOX_REDIRECT_URI  # must match the Upstox app's redirect URL exactly
        value: https://smartmoney-hpr7.onrender.com/callback
      - key: UPSTOX_API_KEY
        sync: false
      - key: UPSTOX_API_SECRET
        sync: false
      - key: UPSTOX_ACCESS_TOKEN  # optional: today's token, so the site starts LIVE
        sync: false
      - key: OB_SYNC_KEY    # optional: shared secret for the desktop token bridge
        sync: false
