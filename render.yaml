services:
  - type: web
    name: ictob-scanner
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free             # $0 forever; sleeps after 15 min idle and wakes in ~1 min
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: OB_CLOUD       # the deployed copy takes its feed from the local scanner
        value: "1"
      - key: UPSTOX_API_KEY
        sync: false
      - key: UPSTOX_API_SECRET
        sync: false
      - key: UPSTOX_ACCESS_TOKEN  # optional: today's token, so the site starts LIVE
        sync: false
      - key: OB_SYNC_KEY    # shared secret used to receive that token
        sync: false
