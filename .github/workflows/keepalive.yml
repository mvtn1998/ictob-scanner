name: keep-alive

# Render's free tier sleeps a web service after 15 minutes without traffic.
# A request every 5 minutes keeps it awake, so the site answers instantly from
# anywhere. Scheduled workflows are free on public repositories.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wake https://smartmoney-hpr7.onrender.com
        run: |
          for i in 1 2 3; do
            if curl -fsS --max-time 90 https://smartmoney-hpr7.onrender.com/healthz > /dev/null; then
              echo "site answered"
              exit 0
            fi
            sleep 10
          done
          echo "site did not answer" >&2
          exit 1
